services:
  bridge:
    build: ./server
    container_name: homelab-bridge
    restart: unless-stopped
    # Reseau de l'hote : le bridge ecoute directement sur le port 9999 de la
    # Debian (LAN + VPN) et voit les vraies interfaces reseau (stats reseau
    # de la machine). Ne redirigez JAMAIS ce port vers Internet : l'acces
    # distant passe par le VPN, l'acces local par BRIDGE_TOKEN.
    network_mode: host
    # Espace de processus de l'hote : /proc/1/mountinfo decrit les montages
    # reels (stats disques) et le nombre de processus est celui de la machine.
    pid: host
    environment:
      PORT: '9999'
      HOST: '0.0.0.0'
      MOCK_DOCKER: 'false'
      # Racine de l'hote montee en /hostfs (voir volumes) : stats disques.
      HOST_FS_ROOT: '/hostfs'
      # BRIDGE_TOKEN doit etre definie dans un fichier .env a cote de ce compose
      BRIDGE_TOKEN: '${BRIDGE_TOKEN:?BRIDGE_TOKEN doit etre definie dans le fichier .env}'
    volumes:
      # Socket Docker monte en LECTURE pour le bridge
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Socket D-Bus systeme : permet le redemarrage de l'hote via
      # org.freedesktop.login1 (connect() fonctionne sur un montage :ro)
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      # Racine de l'hote en LECTURE SEULE : statfs() pour les stats disques.
      # propagation rslave : les sous-montages de l'hote (/mnt/nas,
      # /mnt/raid5...) restent visibles sous /hostfs -> statfs correct.
      - type: bind
        source: /
        target: /hostfs
        read_only: true
        bind:
          propagation: rslave
      # Annuaire des services : decommentez apres avoir copie
      # services.yaml.example vers services.yaml (a cote de ce compose)
      # - ./services.yaml:/app/services.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9999/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s